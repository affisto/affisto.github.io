  </header>
  <main class="kana-library section-shell">

      <a class="back-link" href="/hisohiso/">← 홈</a>
      <p class="mono-label">가나 쓰기 · 114개 영상</p>
      <h1>보고 따라 쓰면,<br>손이 먼저 기억해요.</h1>
      <p>오십음도 순서로 글자를 고르면 앱에서 사용하는 획순 영상이 재생됩니다. 히라가나와 가타카나는 토글로 바꿀 수 있어요.</p>

    <section class="kana-practice" aria-label="가나 쓰기 연습">
      <div class="kana-player-wrap">
        <div class="kana-player-meta"><div><span id="script-label">히라가나</span><strong id="selected-glyph">あ</strong></div><p><b id="stroke-count">3</b>획 · <span id="duration">6.3초</span></p></div>

          <source src="/hisohiso/kana/videos/h-3042.mp4" type="video/mp4">
        </video>
        <div class="kana-player-actions">
          <button id="prev-kana" type="button">← 이전</button>
          <button id="replay-kana" type="button">처음부터</button>
          <button id="next-kana" type="button">다음 →</button>
        </div>
      </div>

      <div class="kana-picker">
        <div class="script-toggle" role="toolbar" aria-label="문자 종류">
          <button type="button" data-script="hiragana" aria-pressed="true">히라가나</button>
          <button type="button" data-script="katakana" aria-pressed="false">가타카나</button>
        </div>
        <p id="kana-count" class="kana-count" aria-live="polite">히라가나 109개 영상</p>
